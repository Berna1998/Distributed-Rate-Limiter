apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator2
  namespace: rate-limiter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator2
  template:
    metadata:
      labels:
        app: aggregator2
    spec:
      containers:
        - name: aggregator2
          image: localhost:5000/distributed-rate-limiter-aggregator2:latest
          imagePullPolicy: Always
          args: ["-id=node2", "-port=50052"]
          envFrom:
            - configMapRef:
                name: rate-limiter-config
          env:
            - name: SELF_ADDRESS
              value: "aggregator2:50052"
          ports:
            - containerPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator2
  namespace: rate-limiter
spec:
  selector:
    app: aggregator2
  ports:
    - port: 50052
      targetPort: 50052
