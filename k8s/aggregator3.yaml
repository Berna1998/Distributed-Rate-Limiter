apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator3
  namespace: rate-limiter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aggregator3
  template:
    metadata:
      labels:
        app: aggregator3
    spec:
      containers:
        - name: aggregator3
          image: localhost:5000/distributed-rate-limiter-aggregator3:latest
          imagePullPolicy: Always
          args: ["-id=node3", "-port=50053"]
          envFrom:
            - configMapRef:
                name: rate-limiter-config
          env:
            - name: SELF_ADDRESS
              value: "aggregator3:50053"
          ports:
            - containerPort: 50053
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator3
  namespace: rate-limiter
spec:
  selector:
    app: aggregator3
  ports:
    - port: 50053
      targetPort: 50053
